
eventflow:
  outbox:
    enabled: ${OUTBOX_ENABLED:false}
    batch-size: 10
    lease: PT5M
    poll-interval-ms: 5000
    initial-delay-ms: 5000

spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:eventflow}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  application:
    name: order-service

  jpa:
    open-in-view: false
    hibernate:
    ddl-auto: validate
    show-sql: false

  datasource:
    url: jdbc:postgresql://localhost:5432/eventflow_orders
    username: eventflow
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: 8080
