
spring:
  application:
    name: order-service

  jpa:
    open-in-view: false
    hibernate:
    ddl-auto: validate
    show-sql: false

  datasource:
    url: jdbc:postgresql://localhost:5432/eventflow_orders
    username: eventflow
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: 8080
