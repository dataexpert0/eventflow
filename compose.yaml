services:
  postgres:
    image: postgres:17
    container_name: eventflow-postgres

    environment:
      POSTGRES_DB: eventflow_orders
      POSTGRES_USER: eventflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventflow -d eventflow_orders"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
